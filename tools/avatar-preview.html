<!doctype html><html><head><base href="/"></head><body style="margin:0;background:#789"><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createBike, makeGeo } from '/src/riders/bike.js';
import { loadCharacter, createAvatar, KITS } from '/src/riders/avatar.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(1400, 700);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa3b5);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 3); d.position.set(2, 4, 3); scene.add(d);
const g = new THREE.Mesh(new THREE.PlaneGeometry(20, 20).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x555a55 })); scene.add(g);
const q = new URLSearchParams(location.search), kinds = ['male', 'female'], views = [[2.6, 1.1, 0.1], [-1.8, 1.5, -2.4], [0.01, 1.2, 3.2], [1.5, 1.6, 2.2]];
const riders = [];
for (let i = 0; i < 4; i++) {
  const rig = new THREE.Group(); const side = !/front|back/.test(q.get('v') || 'side'); rig.position.set(side ? 0 : (i - 1.5) * 1.6, 0, side ? (i - 1.5) * 2.3 : 0); scene.add(rig);
  // ?who=[[kg, metres], ...] sets the four riders' builds
  const K = q.get('kits') ? q.get('kits').split(',') : Object.keys(KITS);
  const who = (q.get('who') ? JSON.parse(q.get('who')) : [[72, 1.8], [58, 1.66], [95, 1.78], [78, 1.62]])[i], geo = makeGeo(who[1] / 1.8);
  const bike = createBike({ frame: KITS[K[i]].bike, geo, style: i < 2 ? 'climbing' : 'aero' }); rig.add(bike.object);
  const av = createAvatar(await loadCharacter(kinds[i % 2]), { kit: KITS[K[i]], sex: kinds[i % 2], kg: who[0], heightM: who[1], skin: ['light', 'medium', 'tan', 'dark'][i], geo }); rig.add(av.object);
  const a = +(q.get('a') || 0) + i * 1.3; bike.update(0, a); av.pose(a); riders.push(av);
}
const cam = new THREE.PerspectiveCamera(38, 2, 0.1, 100);
const v = q.get('v') || 'side';
if (v === 'side') { cam.fov = 30; cam.updateProjectionMatrix(); cam.position.set(-12, 1.2, 0); cam.lookAt(0, 0.9, 0); }
if (v === 'front') { cam.fov = 26; cam.updateProjectionMatrix(); cam.position.set(1.2, 1.3, 8); cam.lookAt(0, 0.95, 0); }
if (v === 'back') { cam.fov = 26; cam.updateProjectionMatrix(); cam.position.set(1.0, 2.0, -8); cam.lookAt(0, 0.95, 0); }
if (v === 'close') { cam.fov = 30; cam.updateProjectionMatrix(); cam.position.set(-3.6, 1.5, 0.2); cam.lookAt(0, 1.0, -0.2); }
if (v === 'bike') { cam.fov = 16; cam.updateProjectionMatrix(); cam.position.set(-7.5, 1.0, q.get('z') ? +q.get('z') : -3.45); cam.lookAt(0, 0.62, q.get('z') ? +q.get('z') : -3.45); }
if (v === 'bike34') { cam.fov = 18; cam.updateProjectionMatrix(); cam.position.set(-3.6, 1.5, 4.6); cam.lookAt(0, 0.6, 1.2); }
if (v === 'head') { cam.fov = 9; cam.updateProjectionMatrix(); cam.position.set(-1.6, 1.5, 2.9); cam.lookAt(0, 1.4, 1.72); }
if (v === 'headside') { cam.fov = 9; cam.updateProjectionMatrix(); cam.position.set(-2.4, 1.45, 1.75); cam.lookAt(0, 1.4, 1.72); }
if (v === 'headback') { cam.fov = 9; cam.updateProjectionMatrix(); cam.position.set(-1.2, 1.7, 0.3); cam.lookAt(0, 1.4, 1.72); }
if (v === 'hands') { cam.fov = 6; cam.updateProjectionMatrix(); cam.position.set(-3, 1.05, -0.6); cam.lookAt(0, 0.93, -0.6); }
if (v === 'handstop') { cam.fov = 7; cam.updateProjectionMatrix(); cam.position.set(0, 4, -0.62); cam.up.set(0, 0, 1); cam.lookAt(0, 0.95, -0.6); }
if (v === 'hands34') { cam.fov = 6; cam.updateProjectionMatrix(); cam.position.set(-1.6, 1.5, 1.4); cam.lookAt(-0.12, 0.93, -0.58); }
if (v === 'handsin') { cam.fov = 6; cam.updateProjectionMatrix(); cam.position.set(1.2, 1.6, -3.0); cam.lookAt(-0.15, 0.93, -0.6); }
if (v === 'seat') { cam.fov = 10; cam.updateProjectionMatrix(); cam.position.set(-3, 1.15, -1.3); cam.lookAt(0, 1.05, -1.3); }
if (v === 'seatback') { cam.fov = 10; cam.updateProjectionMatrix(); cam.position.set(-1.4, 1.6, -3.4); cam.lookAt(0, 1.05, -1.3); }
if (v === 'feet') { cam.fov = 8; cam.updateProjectionMatrix(); cam.position.set(-2.6, 0.35, 1.3); cam.lookAt(0, 0.24, 1.2); }
if (v === 'feettop') { cam.fov = 8; cam.updateProjectionMatrix(); cam.position.set(-1.2, 1.8, 2.4); cam.lookAt(-0.1, 0.22, 1.2); }
if (q.get('norider')) riders.forEach(r => { r.object.visible = false; });
if (v === 'arm') { cam.fov = 12; cam.updateProjectionMatrix(); cam.position.set(-3, 1.5, -1.0); cam.lookAt(0, 1.15, -1.0); }
if (v === 'torso') { cam.fov = 14; cam.updateProjectionMatrix(); cam.position.set(-3.2, 1.6, 2.1); cam.lookAt(0, 1.1, 1.25); }
r.render(scene, cam); window.done = { lean: riders.map(x => x.lean) }; window.riders = riders;
</script></body></html>
