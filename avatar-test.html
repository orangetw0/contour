<!doctype html><html><body style="margin:0;background:#789"><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createBike } from '/src/riders/bike.js';
import { loadCharacter, createAvatar, KITS } from '/src/riders/avatar.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(1400, 700);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa3b5);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 3); d.position.set(2, 4, 3); scene.add(d);
const g = new THREE.Mesh(new THREE.PlaneGeometry(20, 20).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x555a55 })); scene.add(g);
const q = new URLSearchParams(location.search), kinds = ['male', 'female'], views = [[2.6, 1.1, 0.1], [-1.8, 1.5, -2.4], [0.01, 1.2, 3.2], [1.5, 1.6, 2.2]];
const riders = [];
for (let i = 0; i < 4; i++) {
  const rig = new THREE.Group(); const side = !/front|back/.test(q.get('v') || 'side'); rig.position.set(side ? 0 : (i - 1.5) * 1.6, 0, side ? (i - 1.5) * 2.3 : 0); scene.add(rig);
  const bike = createBike({ frame: Object.values(KITS)[i].bike }); rig.add(bike.object);
  const av = createAvatar(await loadCharacter(kinds[i % 2]), { kit: Object.values(KITS)[i] }); rig.add(av.object);
  const a = +(q.get('a') || 0) + i * 1.3; bike.update(0, a); av.pose(a); riders.push(av);
}
const cam = new THREE.PerspectiveCamera(38, 2, 0.1, 100);
const v = q.get('v') || 'side';
if (v === 'side') { cam.position.set(-12, 1.2, 0); cam.lookAt(0, 0.95, 0); }
if (v === 'front') { cam.position.set(0, 1.4, 9); cam.lookAt(0, 0.95, 0); }
if (v === 'back') { cam.position.set(1.5, 2.2, -8); cam.lookAt(0, 0.95, 0); }
if (v === 'close') { cam.fov = 30; cam.updateProjectionMatrix(); cam.position.set(-3.6, 1.5, 0.2); cam.lookAt(0, 1.0, -0.2); }
r.render(scene, cam); window.done = { lean: riders.map(x => x.lean) };
</script></body></html>
