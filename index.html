<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contour</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b id="h-pw">220</b><span>watts</span></div>
  <div><b id="h-p3">220</b><span>3 s avg</span></div>
  <div><b id="h-wk">0.0</b><span>w/kg</span></div>
  <div><b id="h-sp">0.0</b><span id="h-sp-u">km/h</span></div>
  <div><b id="h-gr">0.0</b><span>gradient %</span></div>
  <div><b id="h-di">0.00</b><span id="h-di-u">km</span></div>
  <div id="h-hr-box" hidden><b id="h-hr">–</b><span>bpm</span></div>
  <div id="h-cd-box" hidden><b id="h-cd">–</b><span>rpm</span></div>
  <div id="h-dr-box" hidden><b id="h-dr">0</b><span>draft %</span></div>
</div>
<div id="ctl">
  <span>POWER</span>
  <input id="pwr" type="range" min="0" max="600" step="5" value="220" aria-label="Power in watts">
  <span title="Up and down: power. Left and right: steer within your lane.">↑ ↓ ← → keys</span>
  <button id="skip" title="Jump 250 m up the road (the ] key; [ goes back)">Skip 250 m ›</button>
  <button id="view" title="Switch between riding behind your rider and the view from the saddle (V key)">View</button>
  <button id="uturn" title="Turn round and ride back the other way (U key)">U-turn</button>
  <button id="pause" title="Stop the ride and the recording until you resume (P key)">Pause</button>
  <button id="voice" title="Say: rain, mist, overcast, sunny, skip, back, hide or show. For a smart trainer: easier or gear down, harder or gear up, flat, full">Voice: off</button>
  <button id="course" title="Switch between the invented valley and the real Leckhampton Hill loop">Course</button>
  <span id="wx"><button data-w="snow">Snow</button><button data-w="golden" class="on">Golden</button><button data-w="overcast">Overcast</button><button data-w="rain">Rain</button><button data-w="mist">Mist</button><button data-w="starry">Starry</button></span>
  <button id="bt">Connect trainer</button>
  <span id="hills" title="How much of each hill a smart trainer makes you feel. Turn it down if the climbs are too hard; 0 % is flat."><button id="hless" aria-label="Make hills easier">−</button><span id="hval">Hills 50 %</span><button id="hmore" aria-label="Make hills harder">+</button></span>
  <button id="clean" title="Hide everything on screen (H key, or say “hide”). Press H, click, or say “show” to bring it back">Hide info</button>
  <button id="hr" title="Connect a Bluetooth heart-rate monitor (Chrome or Edge)">Heart rate</button>
  <button id="pacerbtn" title="Riders holding a steady pace round the course. Join one to ride with it.">Pacers</button>
  <button id="riderbtn" title="Your rider, weight, bike and units">Rider</button>
  <button id="logbtn" title="Distance you have ridden, kept in this browser">Log</button>
  <button id="save" title="Download this ride as a FIT file, to upload to Strava, Garmin Connect, Wahoo or another training site">Save ride</button>
</div>
<div id="log" class="panel" hidden></div>
<div id="rider" class="panel" hidden></div>
<div id="pacers" class="panel" hidden></div>
<div id="chat" aria-live="polite"></div>
<div id="credit"></div>
<div id="loading">Building the valley…</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
